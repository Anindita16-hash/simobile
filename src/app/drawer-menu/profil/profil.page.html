<ion-header [translucent]="true">
  <ion-toolbar>
    <!--drawer set-->
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    
    <ion-title>
      Profil
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">profil</ion-title>
    </ion-toolbar>
  </ion-header>

  <!--profil user-->
  <div class="user-profile">
    <ion-avatar class="photo">
      <img src="assets/icon/user-default.png" alt="Avatar">
    </ion-avatar>

    <h1>=USERNAME PLACEHOLDER=</h1>
    
    <p>
      <ion-icon name="call-outline"></ion-icon>
      =PHONE PLACEHOLDER=
    </p>

    <p>
      <ion-icon name="mail-outline"></ion-icon>
      =EMAIL PLACEHOLDER=
    </p>
  </div>

  <!--profil toko-->
  <div class="store-profile">
    <h2>Informasi Toko</h2>
    <ion-list inset="true">
      <ion-item>
        <ion-icon slot="start" name="storefront-outline"></ion-icon>
        <ion-label>
          <p>Nama Toko</p>
          <p>=STORE NAME PLACEHOLDER=</p>
        </ion-label>
      </ion-item>

      <ion-item>
        <ion-icon slot="start" name="location-outline"></ion-icon>
        <ion-label>
          <p>Alamat Toko</p>
          <p>=STORE ADDRESS PLACEHOLDER=</p>
        </ion-label>
      </ion-item>
      
    </ion-list>
  </div>

  <ion-button expand="block" routerLink="/profil/profil-edit">
    <ion-icon slot="start" name="create-outline"></ion-icon>
    Edit Profil
  </ion-button>
</ion-content>
