<ion-header [translucent]="true">
  <ion-toolbar>
    <!--back button, manual-->
    <ion-buttons slot="start">
      <ion-button routerLink="/produk">
        <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>

    <ion-title>
      Form Produk
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">produk-form</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-card>
    <ion-card-header>
      <ion-card-title *ngIf="(this.id === undefined || this.id === '')">Tambah Produk</ion-card-title>
      <ion-card-title *ngIf="(this.id !== undefined && this.id !== '')">Edit Produk</ion-card-title>
      <hr>
    </ion-card-header>

    <ion-card-content class="form-text remove-top">
      <ion-list lines="full" (ionFocus)="checkValid()" (keyup)="checkValid()">
        <ion-item>
          <ion-select labelPlacement="stacked" label="Kategori" placeholder="Pilih Kategori Produk"
            [(ngModel)]="newCategory">
            <ion-select-option *ngFor="let cat of categories" [value]="cat.name">{{ cat.name }}</ion-select-option>
          </ion-select>
        </ion-item>
        <ion-item *ngIf="!categoryFilled" color="light">
          <ion-label color="danger">Kategori produk harus dipilih!</ion-label>
        </ion-item>
        <ion-item>
          <ion-input labelPlacement="stacked" label="Nama" [(ngModel)]="newName"
            placeholder="Masukkan Nama Produk"></ion-input>
        </ion-item>
        <ion-item *ngIf="!nameFilled" color="light">
          <ion-label color="danger">Nama produk harus diisi!</ion-label>
        </ion-item>
        <ion-item class="row-flex">
          <ion-input type="url" labelPlacement="stacked" label="Gambar" placeholder="Masukkan URL Gambar"
            [(ngModel)]="newURL"></ion-input>
          <ion-img [src]="newURL || defaultImage" class="image-preview"></ion-img>
        </ion-item>
        <ion-item>
          <ion-input labelPlacement="stacked" label="Isi Bersih" [(ngModel)]="newNet"
            placeholder="Masukkan Ukuran Produk (contoh: 1500ml, 500gr)"></ion-input>
        </ion-item>
        <ion-item>
          <ion-input labelPlacement="stacked" label="Merek" [(ngModel)]="newBrand"
            placeholder="Masukkan Merek Produk"></ion-input>
        </ion-item>
        <ion-item>
          <ion-textarea labelPlacement="stacked" label="Deskripsi" [autoGrow]="true" [(ngModel)]="newDescription"
            placeholder="Masukkan Deskripsi Produk"></ion-textarea>
        </ion-item>
        <ion-item class="row-flex">
          <ion-input labelPlacement="stacked" label="Stok" [(ngModel)]="newStock"
            placeholder="Masukkan Stok Produk"></ion-input>
        </ion-item>
        <ion-item *ngIf="!stockFilled || !stockValid" color="light">
          <ion-label color="danger">{{ getWarningMessage('stock') }}</ion-label>
        </ion-item>
        <ion-item>
          <ion-input labelPlacement="stacked" label="Harga Beli" [(ngModel)]="newBuyPrice"
            placeholder="Masukkan Harga Beli" (keyup)="calculateProfit()"></ion-input>
        </ion-item>
        <ion-item *ngIf="!buyPriceFilled || !buyPriceValid" color="light">
          <ion-label color="danger">{{ getWarningMessage('buy') }}</ion-label>
        </ion-item>
        <ion-item>
          <ion-input labelPlacement="stacked" label="Harga Jual" [(ngModel)]="newSellPrice"
            placeholder="Masukkan Harga Jual" (keyup)="calculateProfit()"></ion-input>
        </ion-item>
        <ion-item *ngIf="!sellPriceFilled || !sellPriceValid" color="light">
          <ion-label color="danger">{{ getWarningMessage('sell') }}</ion-label>
        </ion-item>
        <ion-item>
          <ion-input labelPlacement="stacked" label="Estimasi Keuntungan" [readonly]="true"
            [value]="formatPrice(profit)"></ion-input>
        </ion-item>
        <ion-button id="btnSave" expand="block" (click)="saveData()">Simpan</ion-button>
        <ion-alert [isOpen]="productSaved" header="Simpan Produk" message="Data produk berhasil disimpan." [buttons]="alertButtons"></ion-alert>
      </ion-list>
    </ion-card-content>
  </ion-card>
  <ion-list lines="full"></ion-list>
</ion-content>
