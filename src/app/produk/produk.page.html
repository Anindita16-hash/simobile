<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Daftar Produk</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Produk</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Search Bar Katalog -->
  <ion-searchbar [(ngModel)]="keyword" (ionInput)="filter()" placeholder="Cari Produk"></ion-searchbar>

  <!-- Empty State Default -->
  <div class="empty-state ion-text-center ion-padding" *ngIf="products.length === 0">
    <ion-icon name="cube-outline" size="large"></ion-icon>
    <p>Belum ada produk.</p>
  </div>

  <!-- Product List Grid -->
  <ion-grid>
    <ion-row class="product-row" *ngFor="let products2 of chunkArray(products, gridColumn)">
      <ion-col *ngFor="let product of products2">
        <ion-card button [routerLink]="['/produk/produk-detail', product.id]">
          <ion-img [src]="product.url || defaultImage" class="product-image" [alt]="product.name || product.nama"></ion-img>
          <ion-card-header>
            <div class="row-flex">
              <ion-card-title>{{ product.brand }} {{ product.name || product.nama }}</ion-card-title>
              <ion-badge [color]="(product.stock ?? product.stok) === 0 ? 'danger' : (product.stock ?? product.stok) < 10 ? 'warning' : 'medium'">
                Stok: {{ product.stock ?? product.stok }}
              </ion-badge>
            </div>
            <ion-card-subtitle>{{ product.category || product.quantity }}</ion-card-subtitle>
          </ion-card-header>
          <ion-card-content>
            <div class="row-flex">
              <ion-label class="product-price">{{ formatPrice(product.sellPrice || product.hargaJual) }}</ion-label>
            </div>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>

  <!-- Floating Action Button (FAB) Tambah Produk -->
  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button routerLink="/produk/produk-form">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
